<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body>
    <div class="container m-p">
      <div id="checkbox-window" class="checkbox-window m-p block">
        <div class="checkbox-container m-p">
          <button
            type="button"
            id="checkbox"
            class="checkbox m-p line-normal"
          ></button>
        </div>
        <p class="im-not-a-robot m-p line-normal">I'm not a robot</p>
        <img
          src="./assets/img/ca.png"
          class="captcha-logo line-normal"
          alt=""
        />
        <br />
        <p class="checkbox-desc m-p line-normal">
          <a href="https://www.google.com/intl/en/policies/privacy/">Privacy</a>
          - <a href="https://www.google.com/intl/en/policies/terms/">Terms</a>
        </p>
        <img class="spinner" alt="" id="spinner" />
      </div>

      <div id="verify-window" class="verify-window">
        <div class="verify-container">
          <header class="verify-header">
            <span class="verify-header-text-medium m-p block">Verification</span>
            <span class="verify-header-text-big m-p block">Complete</span>
            <span class="verify-header-text-medium m-p block"></span>
          </header>
          <main class="verify-main">
            <p id="verification-status">Checking this browser locally...</p>
          </main>
        </div>
        <footer class="verify-container verify-footer">
          <button
            type="button"
            class="verify-verify-button block"
            id="verify-verify-button"
          >
            Verify
          </button>
        </footer>
      </div>

      <section id="final-loader" class="final-loader" hidden aria-live="polite">
        <div class="final-loader-inner">
          <div class="final-loader-heading">
            <span>LOADING...</span>
            <span id="loader-percent">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>
      </section>

      <section class="contact-panel" style="max-width: 560px; margin: 32px auto 0; padding: 20px; font-family: sans-serif;">
        <h2 style="margin: 0 0 16px;">Contact</h2>
        <form id="contact-form" novalidate>
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0;pointer-events:none;" aria-hidden="true" />
          <div style="display: grid; gap: 12px;">
            <label>
              <span style="display:block; margin-bottom:6px;">Name</span>
              <input type="text" id="contact-name" name="name" required style="width:100%; padding: 10px 12px; box-sizing: border-box;" />
            </label>
            <label>
              <span style="display:block; margin-bottom:6px;">Email</span>
              <input type="email" id="contact-email" name="email" required style="width:100%; padding: 10px 12px; box-sizing: border-box;" />
            </label>
            <label>
              <span style="display:block; margin-bottom:6px;">Message</span>
              <textarea id="contact-message" name="message" rows="5" required style="width:100%; padding: 10px 12px; box-sizing: border-box; resize: vertical;"></textarea>
            </label>
            <button type="submit" style="padding: 12px 16px; cursor:pointer;">Send message</button>
            <p id="contact-status" aria-live="polite" style="min-height: 1.5em; margin: 0;"></p>
          </div>
        </form>
      </section>
    </div>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
